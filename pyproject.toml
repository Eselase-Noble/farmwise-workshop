[project]
name = "farmwise"
version = "0.1.0"
description = "FarmWise — a smart farming assistant (crop recommendation ML + farming Q&A RAG). Session 1 demo for the Africa Digital Skills Conference."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eselase-Noble" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn==1.9.1",  # must match models/crop_model.joblib
    "joblib>=1.3",
    "matplotlib>=3.8",
    "chromadb>=0.5",
    "pypdf>=4.2",
    "requests>=2.31",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbconvert>=7.16",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farmwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
