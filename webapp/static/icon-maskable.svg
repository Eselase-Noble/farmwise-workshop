    <path d="M32 37 C22 35.5 15 39 12 47 C22 47.5 29.5 43 32 37 Z" fill="url(#fwLeaf)"/>
    <path d="M32 29 C42 24 50 26.5 53 35 C43 38.5 35 35.5 32 29 Z" fill="url(#fwCyan)"/>
    <circle cx="32" cy="19" r="6" fill="#2fd98a"/>
    <circle cx="32" cy="19" r="2.6" fill="#061037"/>
  </g>
</svg>
