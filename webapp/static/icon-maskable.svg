<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="FarmWise">
  <defs>
    <linearGradient id="fwTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a4a"/>
      <stop offset="1" stop-color="#061037"/>
    </linearGradient>
    <linearGradient id="fwLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd98a"/>
      <stop offset="1" stop-color="#1f9d55"/>
    </linearGradient>
    <linearGradient id="fwCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36c6dd"/>
      <stop offset="1" stop-color="#01a7c2"/>
