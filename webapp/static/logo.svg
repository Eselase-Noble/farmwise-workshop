<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="FarmWise">
  <defs>
    <linearGradient id="fwLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd98a"/>
      <stop offset="1" stop-color="#1f9d55"/>
    </linearGradient>
    <linearGradient id="fwCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36c6dd"/>
      <stop offset="1" stop-color="#01a7c2"/>
    </linearGradient>
  </defs>
  <!-- soil line -->
  <path d="M8 33 Q20 30.5 32 33" stroke="#01a7c2" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
  <!-- stem -->
  <path d="M20 33 C20 25 20 20 20 14" stroke="url(#fwLeaf)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- left leaf -->
  <path d="M20 24 C13.5 23 9 25.5 7 31 C13.5 31.5 18.5 28.5 20 24 Z" fill="url(#fwLeaf)"/>
  <!-- right leaf -->
  <path d="M20 19 C26.5 15.5 32 17.5 34 23 C27.5 25.5 22 23.5 20 19 Z" fill="url(#fwCyan)"/>
  <!-- smart node at the growing tip -->
  <circle cx="20" cy="11.5" r="4" fill="#2fd98a"/>
  <circle cx="20" cy="11.5" r="1.7" fill="#061037"/>
</svg>
